<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/ism.css' | relative_url }}">
<script src="{{ '/assets/ism.js' | relative_url }}" defer></script>
</head>
<body{% if page.toc %} class="has-toc"{% endif %}>

<header class="masthead">
  <div class="masthead__inner">
    <a class="masthead__mark" href="{{ '/' | relative_url }}" aria-label="Image Scale Metadata">
      <svg viewBox="45.76 66.66 1173.40 391.06" aria-hidden="true"><use href="{{ '/assets/ism-mark.svg#ism' | relative_url }}"/></svg>
    </a>
    <nav class="masthead__nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Specification</a>
      <a href="{{ '/viewer/' | relative_url }}">Viewer</a>
      <a href="{{ '/validator/' | relative_url }}">Validator</a>
      <a href="{{ '/testfiles/' | relative_url }}"{% if page.url == '/testfiles/' %} aria-current="page"{% endif %}>Test files</a>
      <a href="https://github.com/image-scale-metadata/image-scale-metadata.github.io">Repository</a>
    </nav>
  </div>
</header>

<div class="shell{% if page.toc %} shell--toc{% endif %}">
  {% if page.toc %}<aside class="toc" aria-label="Contents"></aside>{% endif %}
  <main class="page">
    {{ content }}
  </main>
</div>

<footer class="colophon">
  <div class="colophon__inner">
    <span>The specification is CC BY 4.0; the code in the repository is MIT. Anyone may implement it.</span>
    <span>Namespace: <a href="https://w3id.org/ism/">w3id.org/ism</a></span>
  </div>
</footer>

</body>
</html>
